services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: deepseek-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deepseek_agent}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
    ports:
      - "15432:5432"
    volumes:
      - deepseek_postgres_data:/var/lib/postgresql/data
      - ./apps/server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  deepseek_postgres_data:
